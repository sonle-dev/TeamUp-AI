<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Tài khoản Google</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1f1f1f;
      color: #e3e3e3;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      padding: 24px 32px 16px;
      user-select: none;
    }
    
    .card-container {
      background-color: #2b2b2b;
      border-radius: 28px;
      padding: 36px 40px;
      max-width: 580px;
      width: 100%;
      margin: auto;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }
    
    .google-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .google-header span {
      font-size: 15px;
      font-weight: 500;
      color: #e3e3e3;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 32px;
    }

    .left-col h1 {
      font-size: 26px;
      font-weight: 400;
      color: #e3e3e3;
      margin-bottom: 12px;
      line-height: 1.25;
    }
    .left-col p {
      font-size: 14px;
      color: #c4c7c5;
      line-height: 1.45;
    }
    .left-col p b {
      color: #a8c7fa;
      font-weight: 500;
    }

    .account-list {
      display: flex;
      flex-direction: column;
      border-top: 1px solid #444746;
    }
    .account-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 10px;
      border-bottom: 1px solid #444746;
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 0.15s ease;
      text-decoration: none;
      color: inherit;
    }
    .account-item:hover {
      background-color: rgba(255, 255, 255, 0.06);
    }

    .avatar-img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #1a73e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 500;
      color: #ffffff;
      flex-shrink: 0;
    }

    .account-info {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .account-name {
      font-size: 14px;
      font-weight: 500;
      color: #e3e3e3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .account-email {
      font-size: 12px;
      color: #c4c7c5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .use-other-account {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 10px;
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 0.15s ease;
      color: #e3e3e3;
      font-size: 13.5px;
      font-weight: 500;
    }
    .use-other-account:hover {
      background-color: rgba(255, 255, 255, 0.06);
    }
    .use-other-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #5e5e5e;
      flex-shrink: 0;
      color: #c4c7c5;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 580px;
      width: 100%;
      margin: 16px auto 0;
      font-size: 12px;
      color: #c4c7c5;
    }
    .footer-links {
      display: flex;
      gap: 20px;
    }
    .footer-links a, .footer span {
      color: #c4c7c5;
      text-decoration: none;
      cursor: pointer;
    }
    .footer-links a:hover {
      color: #e3e3e3;
    }

    /* Loading overlay */
    .loading-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(31, 31, 31, 0.85);
      border-radius: 28px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 50;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #a8c7fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card-container" style="position: relative;">
    <!-- Loading spinner on selection -->
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner"></div>
      <span style="font-size: 13px; color: #a8c7fa;">Đang kết nối tới TeamUp AI...</span>
    </div>

    <!-- Header Google Logo -->
    <div class="google-header">
      <svg width="24" height="24" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Đăng nhập bằng Google</span>
    </div>

    <!-- Main Split Grid (Exact Google Format) -->
    <div class="main-grid">
      <!-- Left Column -->
      <div class="left-col">
        <h1>Chọn tài khoản</h1>
        <p>Tiếp tục tới <b>TeamUp AI</b></p>
      </div>

      <!-- Right Column: Account Cards -->
      <div>
        <div class="account-list">
          
          <!-- Primary Account: Sơn Lê -->
          <div class="account-item" onclick="chooseAccount('Sơn Lê', 'lehongson270920050@gmail.com', '/images/google_avatar.png')">
            <img src="/images/google_avatar.png" alt="Sơn Lê" class="avatar-img" onerror="this.outerHTML='<div class=\'avatar-img\'>SL</div>'">
            <div class="account-info">
              <div class="account-name">Sơn Lê</div>
              <div class="account-email">lehongson270920050@gmail.com</div>
            </div>
          </div>

          <!-- Secondary Account: Đức Nguyễn -->
          <div class="account-item" onclick="chooseAccount('Đức Nguyễn', 'duc.nguyen@teamup.io', '')">
            <div class="avatar-img" style="background-color: #0b8043;">ĐN</div>
            <div class="account-info">
              <div class="account-name">Đức Nguyễn</div>
              <div class="account-email">duc.nguyen@teamup.io</div>
            </div>
          </div>

        </div>

        <!-- Use another account -->
        <div class="use-other-account" onclick="promptOtherAccount()">
          <div class="use-other-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </div>
          <span>Sử dụng một tài khoản khác</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Links (Exact Google Theme) -->
  <div class="footer">
    <span>Tiếng Việt</span>
    <div class="footer-links">
      <a href="https://support.google.com/accounts" target="_blank">Trợ giúp</a>
      <a href="https://policies.google.com/privacy" target="_blank">Quyền riêng tư</a>
      <a href="https://policies.google.com/terms" target="_blank">Điều khoản</a>
    </div>
  </div>

  <script>
    function chooseAccount(name, email, picture) {
      document.getElementById('loadingOverlay').style.display = 'flex';
      
      setTimeout(() => {
        const payload = {
          type: 'GOOGLE_AUTH_SUCCESS',
          payload: {
            name: name,
            email: email,
            picture: picture || '/images/google_avatar.png'
          }
        };

        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, window.location.origin);
          window.close();
        } else {
          // If opened inside iframe / fallback
          localStorage.setItem('teamup_google_auth_bridge', JSON.stringify(payload.payload));
          window.close();
        }
      }, 400);
    }

    function promptOtherAccount() {
      const email = prompt('Nhập địa chỉ Gmail khác:');
      if (!email || !email.includes('@')) return;
      const name = prompt('Nhập tên hiển thị:', email.split('@')[0]);
      if (!name) return;
      chooseAccount(name, email, '/images/google_avatar.png');
    }
  </script>
</body>
</html>
